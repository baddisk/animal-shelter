<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>🐾 강화군 동물보호센터 - 보호중인 유기동물</title>
  <meta name="description" content="강화도에서 가족을 기다리는 보호중 유기동물 정보와 입양 안내">

  <!-- 파비콘 · 홈 화면 아이콘 (P2) -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#FF6B35">

  <!-- 개체별 링크 미리보기(OG). /a/:id 로 진입 시 서버가 개체 정보로 교체한다 (P0-2) -->
  <!--OG-->

  <link rel="stylesheet" href="css/style.css?v=1.3.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="container">
      <h1><i class="fas fa-paw"></i> 강화유기동물보호센터</h1>
      <p>강화도에서 가족을 기다리는 <b>보호중</b> 아이들입니다 🐶🐱</p>
    </div>
  </header>

  <!-- 검색 필터 -->
  <section class="filters">
    <div class="container">
      <div class="filter-grid">
        <div class="filter-group">
          <label><i class="fas fa-dog"></i> 축종</label>
          <select id="upkind">
            <option value="">전체 축종</option>
            <option value="417000">🐶 강아지</option>
            <option value="422400">🐱 고양이</option>
            <option value="429900">🐾 기타</option>
          </select>
        </div>

        <div class="filter-group">
          <label><i class="far fa-calendar-alt"></i> 조회 시작일 (1년 전)</label>
          <input type="date" id="bgnde">
        </div>

        <div class="filter-group">
          <label><i class="far fa-calendar-alt"></i> 조회 종료일 (오늘)</label>
          <input type="date" id="endde">
        </div>

        <div class="filter-group">
          <label><i class="fas fa-shield-alt"></i> 보호센터 (고정)</label>
          <input type="text" value="강화군 동물보호센터" readonly class="input-fixed">
        </div>

        <div class="filter-group">
          <button id="searchBtn" class="btn-search">
            <i class="fas fa-search"></i> 검색하기
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- 통계 바 -->
  <section class="stats">
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card total">
          <i class="fas fa-home"></i>
          <div>
            <span class="stat-number" id="totalCount">0</span>
            <span class="stat-label">보호중 개체수</span>
          </div>
        </div>
        <div class="stat-card dog">
          <i class="fas fa-dog"></i>
          <div>
            <span class="stat-number" id="dogCount">0</span>
            <span class="stat-label">강아지</span>
          </div>
        </div>
        <div class="stat-card cat">
          <i class="fas fa-cat"></i>
          <div>
            <span class="stat-number" id="catCount">0</span>
            <span class="stat-label">고양이</span>
          </div>
        </div>
        <div class="stat-card etc">
          <i class="fas fa-paw"></i>
          <div>
            <span class="stat-number" id="etcCount">0</span>
            <span class="stat-label">기타</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태 필터 (보호소 지정 상태) -->
  <section class="status-filter-section">
    <div class="container">
      <div class="status-filter" id="statusFilter">
        <button type="button" class="status-chip active" data-status="all">전체 <em id="cntAll">0</em></button>
        <button type="button" class="status-chip chip-foster" data-status="foster">🏡 임시보호중 <em id="cntFoster">0</em></button>
        <button type="button" class="status-chip chip-adopting" data-status="adopting">🤝 입양진행중 <em id="cntAdopting">0</em></button>
        <button type="button" class="status-chip chip-news" data-status="news">📝 새소식 있는 개체 <em id="cntNews">0</em></button>
      </div>
    </div>
  </section>

  <!-- 동물 카드 리스트 -->
  <section class="animals">
    <div class="container">
      <div id="loading" class="loading" style="display:none;">
        <div class="spinner"></div>
        <p>강화군 동물보호센터 데이터를 불러오는 중입니다...</p>
      </div>
      <div id="animalGrid" class="animal-grid"></div>
      <div id="noData" class="no-data" style="display:none;">
        <i class="fas fa-info-circle"></i>
        <p>현재 보호중인 동물이 없습니다.</p>
      </div>
    </div>
  </section>

  <!-- 페이지네이션 -->
  <section class="pagination-section">
    <div class="container">
      <div id="pagination" class="pagination"></div>
    </div>
  </section>

  <!-- 상세 모달창 -->
  <div id="modal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-label="보호동물 상세정보">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>🐾 농림축산식품부 국가동물보호정보시스템 공공데이터 API 연동</p>
      <p>강화군 동물보호센터 입양 문의는 상세페이지의 연락처로 문의하시기 바랍니다.</p>
    </div>
  </footer>

  <!--BOOT-->
  <script src="js/app.js?v=1.3.0"></script>

  <!-- 서비스워커 등록 (P2: 웹앱 설치 — 홈 화면에 앱처럼 추가) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
